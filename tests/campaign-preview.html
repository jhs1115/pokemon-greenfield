<html lang="ko">
<head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓몬 · 그린필드</title><meta name="description" content="풀숲에서 시작하는 포켓몬 타일 전략 배틀"><link rel="stylesheet" href="styles.css?v=battle-size-1"></head>
<body>
<main id="app"></main>
<script src="assets/audio/move-sounds.js?v=journey-24"></script>
<script src="audio.js?v=journey-24"></script><script src="data/reference.js"></script><script src="data/training.js?v=journey-24"></script><script src="data/progression.js?v=journey-24"></script><script src="items.js?v=journey-24"></script><script src="chapter-maps.js?v=journey-24"></script><script src="stages.js?v=journey-24"></script><script src="data/abilities.js?v=journey-24"></script><script src="game-state.js?v=journey-24"></script><script src="moves.js"></script><script src="expanded-moves.js?v=journey-24"></script><script src="engine.js?v=journey-24"></script><script src="assets/effects/manifest.js"></script><script src="effects.js"></script><script src="sprite-effects.js?v=journey-24"></script><script src="assets/vendor/pkmn-sim.js"></script><script src="native-combat.js?v=journey-24"></script><script src="battle-feedback.js?v=journey-24"></script><script src="dialogue.js?v=journey-24"></script><script src="data/move-descriptions.js?v=journey-24"></script><script src="journey.js?v=journey-24"></script><script src="menus.js?v=journey-24"></script><script src="campaign-ui.js?v=journey-24"></script><script src="app.js?v=battle-size-1"></script>
<script>
// Development visual fixture: activeSlot stays null, so no player save is written.
const sceneTools=document.createElement('aside');sceneTools.style.cssText='display:none;position:fixed;top:8px;left:8px;z-index:900;display:none;gap:6px;flex-wrap:wrap';
function campaignFixture(cleared){game=G.normalize({owned:[5,8,2],team:[5,8,2],coins:30,records:{5:G.freshRecord(5,20),8:G.freshRecord(8,20),2:G.freshRecord(2,20)},clears:Array.from({length:40},(_,i)=>i<cleared?1:0),tutorial:{done:true,step:'done'},rocketCleared:cleared>=20,itemsUnlocked:cleared>=20,itemUnlockSeen:cleared>=20,inventory:cleared>=20?{'exp-share':2,'oran-berry':3,'mystic-water':1}:{} });savedTeam=game.team;}
for(const [label,run]of [['웅이 클리어 저장 확인',()=>{campaignFixture(10);view='home';render();}],['2장 지도',()=>{campaignFixture(10);game.itemsUnlocked=true;game.itemUnlockSeen=true;mapChapter=1;selectedStage=10;view='story';render();}],['3장 지도',()=>{campaignFixture(20);mapChapter=2;selectedStage=20;view='story';render();}],['4장 지도',()=>{campaignFixture(30);mapChapter=3;selectedStage=30;view='story';render();}],['이슬이 대사',()=>{campaignFixture(19);game.rocketCleared=true;stage=19;beginStage();}],['스카우트 Lv12',()=>{campaignFixture(20);view='scout';render();}],['트레이닝 실',()=>{campaignFixture(20);view='training';render();}],['도구 관리',()=>{campaignFixture(20);view='manage';render();}],['스타팅 선택',()=>{game=G.normalize();game.tutorial.step='starter';view='tutorial';render();}],['진화의 돌 확인',()=>{campaignFixture(20);game.owned.push(25);game.records[25]=G.freshRecord(25,20);game.moveSets[25]=G.defaultMoves(25,20);game.team[0]=25;game.inventory['thunder-stone']=1;managementTab='items';view='manage';render();}]]){const button=document.createElement('button');button.textContent=label;button.className='secondary';button.onclick=()=>{sceneTools.style.display="none";run();};sceneTools.append(button);}document.body.append(sceneTools);window.addEventListener('load',()=>{sceneTools.style.display='flex';});
</script></body></html>
