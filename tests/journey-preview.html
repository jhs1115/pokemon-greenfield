<script>
window.addEventListener('load',()=>{
 const scene=new URLSearchParams(location.search).get('scene')||'home';
 const owned=[4,7,1,25,16,19,43,54,130,6,9,3];
 const sample=G.normalize({owned,team:owned.slice(0,6),coins:200,records:Object.fromEntries(owned.map(id=>[id,G.freshRecord(id,25)])),tutorial:{done:true,step:'done'},tutorialRewardClaimed:true,clears:Array(70).fill(1),rocketCleared:true,itemsUnlocked:true,itemUnlockSeen:true,inventory:{'exp-share':2,'fire-stone':2,'thunder-stone':1,'miracle-seed':1,'oran-berry':5},story:{seen:['opening','menu-scout','menu-manage','menu-training']}});
 activeSlot=null;game=sample;savedTeam=game.team;
 if(scene==='delete-files'){if(!QA_PROFILE)throw Error('A separate QA profile is required');localStorage.setItem(SAVE_PREFIX+1,JSON.stringify(sample));localStorage.setItem(SAVE_PREFIX+2,JSON.stringify(G.normalize({owned:[7],team:[7],tutorial:{done:true}})));window.addEventListener('pagehide',()=>[1,2,3].forEach(slot=>localStorage.removeItem(SAVE_PREFIX+slot)),{once:true});view='files';render();}
 else if(scene==='cap-manage'||scene==='cap-cleared'){game.clears=Array.from({length:70},(_,i)=>i<(scene==='cap-cleared'?20:10)?1:0);managementReturn={chapter:1,stage:12,scroll:0};mapChapter=1;selectedStage=12;view='manage';render();}
 else if(scene==='shiny-scout'){game.pending=[147,37,58];game.pendingNatures={147:'Serious',37:'Timid',58:'Adamant'};game.pendingShiny={147:true,37:false,58:false};view='scout';render();}
 else if(scene==='early-scout'){game.clears=Array.from({length:70},(_,i)=>i<3?1:0);game.itemsUnlocked=false;game.itemUnlockSeen=false;view='scout';render();}
 else if(scene==='stage'){stage=Math.max(0,Math.min(69,Number(new URLSearchParams(location.search).get('stage'))||0));game.story.seen.push('before-'+stage);beginStage();}
 else if(scene==='scout-call'){stage=2;game.story.seen=['opening'];game.inventory['scout-ticket']=1;game.story.seen.push('village-scout-ticket');view='battle';startBattle();battle.result='win';render();}
 else if(scene==='early-village'){game.clears=Array.from({length:70},(_,i)=>i<3?1:0);game.inventory['scout-ticket']=1;game.story.scoutGiftAvailable=false;game.story.seen=['opening','village-scout-ticket'];view='village';render();}
 else if(scene==='chapter2-meeting'){game.story.seen=[];stage=17;StoryUI.beforeStage(17,()=>{view='story';render();});}
 else if(scene==='chapter2-aftermath'){game.story.seen=[];StoryUI.afterBattle(14,()=>{view='story';render();},{ambush:true});}
 else if(scene==='chapter1-gift'){game=G.normalize({...sample,story:{seen:['opening','after-9']},itemsUnlocked:false,itemUnlockSeen:false,inventory:{}});savedTeam=game.team;view='home';render();}
 else if(scene==='chapter1-forest'){game.story.seen=[];stage=3;StoryUI.beforeStage(3,()=>{view='story';render();});}
 else if(scene==='opening'){game=G.normalize();savedTeam=game.team;view='tutorial';render();}
 else if(scene==='rocket'){stage=37;game.clears[37]=0;game.story.seen=[];beginStage();}
 else if(scene==='brock'){stage=3;game.story.seen=[];beginStage();}
 else if(/^chapter[1-7]$/.test(scene)){mapChapter=+scene.at(-1)-1;if(scene==='chapter6')game.clears=Array.from({length:70},(_,i)=>i<57?1:0);selectedStage=mapChapter*10;view='story';render();}
 else if(scene==='koga'||scene==='sabrina'||scene==='blaine'){stage={koga:49,sabrina:59,blaine:69}[scene];game.clears[stage]=0;beginStage();}
 else if(['pivot','multi','manual'].includes(scene)){const own=scene==='multi'?3:26;game=G.normalize({owned:[own,9],team:[own,9],records:{[own]:G.freshRecord(own,50),9:G.freshRecord(9,50)},tutorial:{done:true},clears:Array(70).fill(1),rocketCleared:true});game.moveSets[own]=[scene==='multi'?331:521];stage=30;startBattle(false,{name:'교체·연속기 확인',chapter:4,theme:'forest',enemy:[143,7],levels:[80,50],moves:[[33],[33]]});battle.pos={x:4,y:3};battle.enemyPos={x:5,y:3};if(scene==='multi')battle.party[0].abilityKey='skilllink';battle.combat=window.NativeCombat.create(battle,D,E,moveFor,[5,2,3,4]);battle.combat.apply(battle.combat.snapshot());aiCommand=()=>({kind:scene==='multi'?'wait':'attack',move:0,destination:{...battle.enemyPos},target:{...battle.pos}});render();let casts=0;const originalEffect=window.playMoveEffect;window.playMoveEffect=async options=>{casts++;return originalEffect(options);};const run=document.createElement('button'),report=document.createElement('output');run.textContent=scene==='multi'?'연속기 실행':scene==='manual'?'일반 교체 실행':'교체기 실행';run.className='secondary';run.id='qa-playback';report.id='qa-playback-report';run.style.cssText='position:fixed;top:8px;left:8px;z-index:999';report.style.cssText='position:fixed;bottom:10px;left:65px;z-index:999;background:#fff8df;color:#294b36;padding:8px';run.onclick=async()=>{run.disabled=true;await resolveTurn(scene==='manual'?{kind:'switch',index:1}:{kind:'attack',move:0,destination:{...battle.pos},target:{...battle.enemyPos}});report.textContent=JSON.stringify({effects:casts,active:player().name,position:battle.pos,audio:window.GameAudio.getState()});};document.body.append(run,report);}
 else if(scene==='result'){stage=0;startBattle();battle.result='win';render();}
 else if(scene==='files'){readSave=slot=>slot===1?sample:slot===2?G.normalize({owned:[7],team:[7],tutorial:{done:true}}):null;view='files';render();}
 else if(scene==='field'){stage=0;startBattle(false,{name:'전장',chapter:5,enemy:[19,16,10,13,23],levels:[20,20,20,20,20],theme:'river'});battle.combat.sim.field.setWeather('raindance',battle.combat.sim.sides[0].active[0]);battle.combat.sim.field.setTerrain('grassyterrain',battle.combat.sim.sides[0].active[0]);battle.combat.apply(battle.combat.snapshot());render();}
 else {view=scene==='bag'?'manage':scene;managementTab=scene==='bag'?'items':'pokemon';render();}
});
