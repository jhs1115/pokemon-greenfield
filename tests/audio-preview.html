<!doctype html><meta charset="utf-8"><title>Native audio QA</title><h1>다운로드 음원 디코딩 확인</h1><button id="decode">음원 검사</button><pre id="result">대기</pre><script src="../assets/audio/move-sounds.js"></script><script>document.querySelector('button').onclick=async()=>{const ctx=new AudioContext(),rows=[];for(const id of [33,45,52,55,84,352]){try{const src='../'+MOVE_SOUNDS[id].src,b=await ctx.decodeAudioData(await(await fetch(src)).arrayBuffer());rows.push(id+': OK '+b.duration.toFixed(2)+'s');}catch(e){rows.push(id+': FAIL '+e.message);}}for(const src of ['quiet-village.mp3','pokemon-trainer-battle.mp3']){try{const b=await ctx.decodeAudioData(await(await fetch('../assets/audio/'+src)).arrayBuffer());rows.push(src+': OK '+b.duration.toFixed(2)+'s');}catch(e){rows.push(src+': FAIL '+e.message);}}document.querySelector('pre').textContent=rows.join('\n');await ctx.close();};</script>
